name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the changed files back to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Add random input
        run: |
          echo $(date) >> deploy_timestamps.txt

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: deploy
          push_options: --force
          create_branch: true
          commit_user_name: datapinter-eng
          commit_user_email: datapinter@gmail.com
          commit_author: datapinter-eng <datapinter@gmail.com>
